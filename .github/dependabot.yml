version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Version updates cannot safely resolve against uv's fixed seven-day
    # cutoff. Refresh them through Build/refresh-lockfile.ps1 instead.
    # Dependabot security updates remain enabled.
    open-pull-requests-limit: 0
    # The reviewed lockfile refresh enforces the same seven-day cooldown
    # through [tool.uv].exclude-newer.
    cooldown:
      default-days: 7
