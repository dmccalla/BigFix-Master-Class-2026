name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One command per step. The Windows runner's shell only reports the last
# command's exit code, so a failed install inside a multi-line step would
# pass silently and surface later as missing modules.
jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install the runtime packages
        run: python -m pip install -r requirements.txt

      - name: Install the test tools
        run: python -m pip install pytest ruff

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Test
        run: python -m pytest -q
