name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install locked CI tools
        run: python .github/install-ci-tools.py

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install the runtime packages
        run: python -m pip install -r requirements.txt

      - name: Install locked CI tools
        run: python .github/install-ci-tools.py

      - name: Test
        run: python -m pytest -q

  delivery:
    name: Client Performance delivery
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      WORKBENCH_RUN_DELIVERY: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install runtime packages
        run: python -m pip install -r requirements.txt
      - name: Install locked test tools
        run: python .github/install-ci-tools.py
      - name: Build and verify the known-answer report
        env:
          WORKBENCH_DELIVERY_OUTPUT: ${{ runner.temp }}/delivery
        run: python -m pytest -q Tests/test_client_delivery.py Tests/test_delivery_tools.py
      - name: Save delivery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-delivery
          path: ${{ runner.temp }}/delivery
          retention-days: 14
