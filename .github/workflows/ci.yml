name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install locked CI tools
        run: python .github/install-ci-tools.py

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install the runtime packages
        run: python -m pip install -r requirements.txt

      - name: Install locked CI tools
        run: python .github/install-ci-tools.py

      - name: Test
        run: python -m pytest -q

  delivery:
    name: Client Performance delivery
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      WORKBENCH_RUN_DELIVERY: "1"
      WORKBENCH_DELIVERY_OUTPUT: ${{ runner.temp }}/delivery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install runtime packages
        run: python -m pip install -r requirements.txt
      - name: Install locked test tools
        run: python .github/install-ci-tools.py
      - name: Build and verify the known-answer report
        run: python -m pytest -q Tests/test_client_delivery.py Tests/test_delivery_tools.py
      - name: Save delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-delivery
          path: ${{ runner.temp }}/delivery
          retention-days: 14
