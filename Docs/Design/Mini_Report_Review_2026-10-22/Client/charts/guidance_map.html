<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BigFix Chart Template</title>
<style></style>
<style>
  /*
   * Design tokens from the handoff's chart_afters.html, updated per the
   * 2026-06-27 Design QA review ("Chart uniformity standard"): one shared shell
   * on every chart: white background, a single 1px hairline border (#E3E9F1)
   * and 14px radius: one border grey (#E3E9F1) for all internal tiles/dividers,
   * and the three approved content patterns (A stat tile / B list row / C bar
   * row). Do not "improve" these values; they are the prescribed design.
   */
  :root{--ink:#0B1640;--text:#0B1640;--muted:#0B1640;--line:#E3E9F1;--card-radius:14px;--tile-radius:12px;--status-bg:#F0F2F5;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#ECF3F8;font-family:'Aptos',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
  .num{font-family:'Aptos',sans-serif;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;}
  .statGrid{display:grid;align-items:start;}
  .statGrid.three{grid-template-columns:repeat(3,minmax(0,1fr));}
  .statGrid.four{grid-template-columns:repeat(4,minmax(0,1fr));}
  .statCell{min-width:0;text-align:left;}
  .metricLabel,.metricCaption,.statValue{display:block;overflow:visible;text-overflow:clip;white-space:normal;max-width:100%;}
  .statValue{line-height:1.08;}
  .export{display:inline-block;background:#ECF3F8;padding:34px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--card-radius);padding:44px 48px 48px 48px;width:2250px;}
  /* FillDB + Deployment Overview use the design-system's tighter dashboard card
     (header strip + inset sections, no outer padding). Same hairline shell. */
  .dashcard{background:#fff;border:1px solid var(--line);border-radius:var(--card-radius);overflow:hidden;width:2250px;}
  /* Executive Snapshot card strip only; the Word section owns title/rule/prose. */
  .snapshot{width:2250px;background:#fff;border:0;border-radius:0;padding:0;}
  .snapshotGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:29px;align-items:stretch;}
  .display{font-family:'Aptos',sans-serif;font-weight:700;}
  .hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;}
  .hright{display:flex;align-items:center;gap:18px;white-space:nowrap;flex:none;margin-top:4px;}
  .title{font-family:'Aptos',sans-serif;font-weight:700;font-size:32px;color:var(--ink);letter-spacing:0;}
  .meta{font-size:18px;color:var(--ink);text-align:right;line-height:1.4;padding-top:6px;}
  .rule{height:1px;background:var(--line);margin:24px 0;}
  .eyebrow{font-weight:700;font-size:15.5px;letter-spacing:.12em;text-transform:uppercase;color:#0C7E88;}
  .pill{display:inline-flex;align-items:center;gap:9px;white-space:nowrap;font-weight:700;font-size:15px;letter-spacing:0;padding:9px 17px;border-radius:24px;background:var(--status-bg);color:var(--ink);}
  .pill .dot{width:10px;height:10px;border-radius:50%;}
  /* .st-* status pills are generated at render from window.SPINE (status_spine.py
     is the single source) by injectSpineCss() -- one edit there re-themes them all. */
  .scoreNum{font-family:'Aptos',sans-serif;font-weight:700;line-height:1;letter-spacing:0;}
  .medal{display:inline-flex;align-items:center;gap:9px;white-space:nowrap;font-weight:700;font-size:15px;letter-spacing:0;padding:9px 17px;border-radius:24px;background:var(--status-bg);color:var(--ink);}
  .medal .mdot{width:11px;height:11px;border-radius:50%;flex:none;}
  .medal .mrange{color:#0B1640;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;}
</style>
<style>.card,.dashcard,.snapshot{width:2250px !important;}</style><style>body,.export{background:#fff;}#mount.card{border:0;border-radius:0;padding:0;width:2250px;}</style><style>body,#mount{font-family:'Aptos',Arial,sans-serif;color:#000032}.num,.scoreNum{font-family:'Aptos',Arial,sans-serif!important;font-variant-numeric:tabular-nums}.title,.display{font-family:'HCLTech Roobert',Aptos,sans-serif!important}</style></head>
<body>
<div class="export"><div id="mount" class="card"></div></div>

<script>
/* eslint-disable */
/* Render functions ported from chart_afters.html, kept identical. Data is read
   from window.DATA (injected by html_charts.py) instead of being hard-coded. */
// The status spine: one ramp used everywhere. Scores map to 3 bands only
// (Advisory is an informational per-finding state, never a score band); Not
// Assessed is excluded. Spine hexes drive dots/bars/chips; amber & grey switch
// to a darker companion hue when they appear as text.
// Read the status spine from the injected window.SPINE -- status_spine.py is the
// single source of truth -- with a fallback copy so this template also renders
// standalone. One edit in status_spine.py re-themes every chart (like the charts
// own layout, the spine owns status color + word). Score bands 85/60 mirror
// status_spine.RATING_SCALE.
const SPINE = window.SPINE || {
  'Healthy':{mark:'#187A43',text:'#187A43',bg:'#D5F5E3',band:'85 to 100'},
  'Advisory':{mark:'#B45309',text:'#B45309',bg:'#E6EFFD',band:''},
  'Needs Attention':{mark:'#B45309',text:'#B45309',bg:'#FFF8E7',band:'60 to 84'},
  'Critical':{mark:'#C2410C',text:'#C2410C',bg:'#FDECEA',band:'0 to 59'},
  'Not Assessed':{mark:'#0B1640',text:'#0B1640',bg:'#F0F2F5',band:''},
};
const bandOf = s => s>=85?'healthy':s>=60?'attention':'critical';
const barOf = {healthy:SPINE['Healthy'].mark,advisory:SPINE['Advisory'].mark,attention:SPINE['Needs Attention'].mark,critical:SPINE['Critical'].mark};
const spineColor = {'Healthy':SPINE['Healthy'].mark,'Advisory':SPINE['Advisory'].mark,'Needs Attention':SPINE['Needs Attention'].mark,'Critical':SPINE['Critical'].mark};
const spineRange = {'Healthy':SPINE['Healthy'].band,'Needs Attention':SPINE['Needs Attention'].band,'Critical':SPINE['Critical'].band};
const tierOf = s => s>=85?'Healthy':s>=60?'Needs Attention':'Critical';
const STATUS_BG = '#F0F2F5';
const STATUS_CLASS_WORD = {healthy:'Healthy',advisory:'Advisory',attention:'Needs Attention',critical:'Critical',notassessed:'Not Assessed'};
const STATUS_WORD_CLASS = {'Healthy':'st-healthy','Advisory':'st-advisory','Needs Attention':'st-attention','Critical':'st-critical','Not Assessed':'st-notassessed'};
function titleCase(text){
  const dotToken = '@@DOT@@';
  let value = String(text || '').replace(/&middot;/g,dotToken);
  value = value.replace(/\s+/g,' ').trim().toLowerCase().replace(/\b([a-z][a-z0-9-]*)/g, w => {
    const lower = w.toLowerCase();
    return ['and','or','of','to','in'].includes(lower) ? lower : lower.charAt(0).toUpperCase() + lower.slice(1);
  });
  return value.replace(/@@dot@@/ig,'·');
}
function dotSep(text){
  return String(text || '')
    .replace(/\s+-\s+/g,' · ')
    .replace(/\s*(?:Â·|·|&middot;)\s*/g,' &middot; ')
    .replace(/&middot;/g,'·')
    .trim();
}
function compactDashboardSubtitle(sub){
  const text = dotSep(sub);
  const match = text.match(/(\d+\s+sections)\s+·\s+(\d+\s+checks)/i);
  if(match) return `Console dashboard rollup · ${match[1]} · ${match[2]}`;
  return text;
}
function statusWordFromLabel(label){
  const text = String(label || '').toLowerCase();
  if(/\bcritical\b/.test(text)) return 'Critical';
  if(/\bneeds\s+attention\b|\battention\b|\bwarning\b|\breview\b|\baction required\b/.test(text)) return 'Needs Attention';
  if(/\badvisory\b/.test(text)) return 'Advisory';
  if(/\bhealthy\b|\bpass(?:ed)?\b/.test(text)) return 'Healthy';
  if(/\bnot assessed\b|\bno data\b/.test(text)) return 'Not Assessed';
  return '';
}
function statusWordFromClass(cls, label){
  const key = String(cls || '').replace(/^st-/,'').toLowerCase();
  return STATUS_CLASS_WORD[key] || statusWordFromLabel(label) || 'Not Assessed';
}
const statusClassFor = word => STATUS_WORD_CLASS[statusWordFromLabel(word) || word] || 'st-notassessed';
function cleanPillDetail(label, word){
  let detail = String(label || '').replace(/\s+/g,' ').trim();
  detail = detail
    .replace(/\bneeds\s+attention\b/ig,' ')
    .replace(/\bcritical\b/ig,' ')
    .replace(/\bhealthy\b/ig,' ')
    .replace(/\badvisory\b/ig,' ')
    .replace(/\bnot\s+assessed\b/ig,' ')
    .replace(/\bwarning\b/ig,' ')
    .replace(/\b(loop|status)\b/ig,' ')
    .replace(/\s*(?:Â·|·|&middot;)\s*/g,' &middot; ')
    .replace(/\s+/g,' ')
    .trim();
  if(detail.toLowerCase() === String(word || '').toLowerCase()) return '';
  return titleCase(detail);
}
function statusPill(cls, label, opts){
  const o = opts || {};
  const word = statusWordFromClass(cls, label);
  const detail = o.detail === false ? '' : cleanPillDetail(label, word);
  const dot = o.dotSize ? `width:${o.dotSize}px;height:${o.dotSize}px;` : '';
  const style = o.small ? 'font-size:14px;padding:6px 12px;gap:7px;' : (o.style || '');
  return `<span class="pill ${STATUS_WORD_CLASS[word] || 'st-notassessed'}" style="${style}"><span class="dot" style="${dot}"></span>${word}${detail?` <span style="font-weight:600;color:#0B1640;">${detail}</span>`:''}</span>`;
}
function countPill(count, singular){
  const n = countNumber(count);
  const noun = n === 1 ? singular : `${singular}s`;
  return `<span class="pill st-notassessed"><span class="dot"></span>${fmtCount(count)} ${titleCase(noun)}</span>`;
}
const _countPattern = /^-?\d+$/;
const fmtCount = v => {
  if(v==null || v==='') return '';
  if(typeof v === 'number' && Number.isFinite(v)) return Math.round(v).toLocaleString('en-US');
  const s = String(v).trim();
  const normalized = s.replace(/,/g,'');
  if(_countPattern.test(normalized)) return Number(normalized).toLocaleString('en-US');
  return s;
};
const countNumber = v => Number(String(v).replace(/,/g,''));
const pluralCount = (n, one, many) => `${fmtCount(n)} ${countNumber(n)===1?one:(many||one+'s')}`;
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMetric = v => {
  const s = String(v ?? '').trim();
  const pair = s.match(/^(-?\d[\d,]*)\s*\/\s*(-?\d[\d,]*)$/);
  if(pair) return `${fmtCount(pair[1])} / ${fmtCount(pair[2])}`;
  return fmtCount(v);
};
const fmtMetricSub = v => {
  const s = String(v ?? '').trim();
  const pairTail = s.match(/^\/\s*(-?\d[\d,]*)$/);
  if(pairTail) return `/ ${fmtCount(pairTail[1])}`;
  return dotSep(s);
};
const clampPct = value => {
  const n = Number(String(value ?? '').replace(/[^0-9.-]/g,''));
  return Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 0;
};
function scoreFill(score, color, radius){
  const pct = clampPct(score);
  const min = pct === 0 ? 'min-width:10px;' : '';
  return `<div style="height:100%;width:${pct}%;${min}background:${color};border-radius:${radius || '999px'};"></div>`;
}
function valueFill(width, color, radius){
  const pct = clampPct(width);
  const cssWidth = String(width || `${pct}%`).trim();
  const min = pct === 0 ? 'min-width:8px;' : '';
  return `<div style="height:100%;width:${cssWidth};${min}background:${color};border-radius:${radius || '999px'};"></div>`;
}
const IMPACT_ORDER = ['critical','high','medium','low'];
const IMPACT_LABEL = {critical:'Critical',high:'High',medium:'Medium',low:'Low'};
const IMPACT_COLOR = {critical:'#C2410C',high:'#B45309',medium:'#0B1640',low:'#0B1640'};
function impactSplitHTML(split, opts){
  const o = opts || {};
  const values = split || {};
  const parts = IMPACT_ORDER
    .map(k=>[k, countNumber(values[k] || 0)])
    .filter(([,n])=>n > 0);
  if(!parts.length) return `<span style="color:#0B1640;">clean</span>`;
  return parts.map(([k,n])=>`<span style="white-space:nowrap;color:${IMPACT_COLOR[k]};"><b class="num">${fmtCount(n)}</b> ${IMPACT_LABEL[k]}</span>`).join(o.separator || ' &middot; ');
}
function findingLineHTML(text){
  return String(text || '').replace(/\b(Critical|High|Medium|Low)\b/g, m=>`<span style="font-weight:800;color:${IMPACT_COLOR[m.toLowerCase()] || '#0B1640'};">${m}</span>`);
}
const hexKey = color => String(color || '').trim().replace(/^#/,'').toUpperCase();
const LEGACY_STATUS_COLOR_MAP = {
  '1F8A5B':'Healthy',
  '1F8A4C':'Healthy',
  'A85D00':'Needs Attention',
  'C77A00':'Needs Attention',
  'D88A0A':'Needs Attention',
  '2A6FDB':'Needs Attention',
  'C5283D':'Critical',
  '5B677A':'Not Assessed',
  '8A93A3':'Not Assessed',
};
function standardStatusColor(color){
  const legacy = LEGACY_STATUS_COLOR_MAP[hexKey(color)];
  if(legacy) return SPINE[legacy].mark;
  return color;
}
function fitNumericValues(){
  document.querySelectorAll('.fit-num').forEach(el=>{
    let size = parseFloat(getComputedStyle(el).fontSize);
    const min = Number(el.dataset.minSize || 18);
    while(el.scrollWidth > el.clientWidth && size > min){
      size -= 1;
      el.style.fontSize = `${size}px`;
    }
  });
}
function scaleTypeRamp(){
  const scale = Number(window.CHART_TYPE_SCALE || 1);
  if(!Number.isFinite(scale) || scale <= 0 || Math.abs(scale - 1) < 0.001) return;
  const items = Array.from(document.querySelectorAll('#mount *')).map(el=>[
    el,
    parseFloat(getComputedStyle(el).fontSize)
  ]);
  items.forEach(([el,size])=>{
    if(Number.isFinite(size) && size > 0){
      el.style.fontSize = `${size * scale}px`;
    }
  });
}
function enforceTypeFloor(){
  const floor = Number(window.CHART_TYPE_FLOOR_CSS_PX || 0);
  if(!Number.isFinite(floor) || floor <= 0) return;
  document.querySelectorAll('#mount, #mount *').forEach(el=>{
    const text = String(el.innerText || '').trim();
    if(!text) return;
    const size = parseFloat(getComputedStyle(el).fontSize);
    if(Number.isFinite(size) && size < floor){
      el.style.fontSize = `${floor}px`;
    }
  });
}
function markSingleLineCells(){
  document.querySelectorAll('#mount .metricCaption').forEach(el=>{
    const text = String(el.textContent || '').replace(/\s+/g,' ').trim();
    if(/\bpassed\b.*\bneeds attention\b.*\bfailed\b/i.test(text)){
      el.dataset.singleLine = el.dataset.singleLine || 'findings-split';
    }
  });
}
function injectSpineCss(){
  const cls = {healthy:'Healthy',advisory:'Advisory',attention:'Needs Attention',critical:'Critical',notassessed:'Not Assessed'};
  const css = Object.entries(cls).map(([c,w])=>`.st-${c}{color:#0B1640;background:${STATUS_BG};} .st-${c} .dot{background:${SPINE[w].mark};}`).join('\n');
  const el = document.createElement('style'); el.textContent = css; document.head.appendChild(el);
}
const spineChip = (tier,big)=>{
  // Not Assessed (or any unknown tier): muted italic chip, no dot/range --
  // never "Not Assessed undefined" or a stray Critical-colored dot.
  if(tier==null || !(tier in spineColor)){
    return `<span class="medal" style="${big?'font-size:17px;padding:11px 20px;':''}color:#0B1640;font-style:italic;">${tier==null?'Not Assessed':tier}</span>`;
  }
  const range = spineRange[tier] ? `<span class="mrange">${spineRange[tier]}</span>` : '';
  return `<span class="medal" style="${big?'font-size:17px;padding:11px 20px;':''}"><span class="mdot" style="background:${spineColor[tier]};${big?'width:13px;height:13px;':''}"></span>${tier}${range}</span>`;
};
// Coverage helpers: a pillar earns a tier only when every category is assessed.
// Partially-assessed pillars never show a score/medal (they'd misread as a full
// rating); they show "Partially Assessed" + how much was covered.
const covLabel = cov => (cov && cov.state==='partial') ? 'Partially Assessed' : 'Not Assessed';
const covSub = cov => (cov && cov.state==='partial' && cov.assessed!=null && cov.total!=null) ? `${fmtCount(cov.assessed)} of ${fmtCount(cov.total)} areas assessed` : '';

function header(title, sub, rightHTML, opts){
  const o = opts || {};
  const cleanSub = dotSep(sub);
  const body = `<div class="hrow"><div style="min-width:0;flex:1;"><div class="title">${title}</div>${cleanSub?`<div style="font-size:18px;color:#0B1640;margin-top:6px;line-height:1.35;">${cleanSub}</div>`:''}</div>${rightHTML?`<div class="hright">${rightHTML}</div>`:''}</div><div class="rule" style="${o.padded?'margin:22px 0 0;':''}"></div>`;
  return o.padded ? `<div style="padding:${o.padding || '26px 28px 0'};">${body}</div>` : body;
}
function scoreColor(d){
  if(d && d.scoreColor) return standardStatusColor(d.scoreColor);
  const n = Number(d && d.score);
  return Number.isFinite(n) ? barOf[bandOf(n)] : SPINE['Not Assessed'].text;
}
function scoreStatusWord(d){
  if(d && d.status) return statusWordFromClass(d.status.cls, d.status.label);
  const n = Number(d && d.score);
  return Number.isFinite(n) ? tierOf(n) : 'Not Assessed';
}
function scoreLockup(d, size){
  const o = arguments[2] || {};
  const slashSize = size >= 56 ? 24 : 20;
  const numeric = typeof d.score === 'number' && Number.isFinite(d.score);
  const scoreText = numeric ? d.score : (d.overallTier || scoreStatusWord(d));
  const color = scoreColor(d);
  const word = scoreStatusWord(d);
  const coverage = d.coverageLine ? `<div style="font-size:14px;color:#0B1640;line-height:1.25;margin-top:4px;white-space:normal;">${d.coverageLine}</div>` : '';
  const status = o.statusWord ? `<div style="font-size:20px;font-weight:800;color:${color};line-height:1.1;margin-top:5px;text-align:right;">${word}</div>` : '';
  return `<div style="display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap;flex:none;">
    <span style="display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap;"><span class="scoreNum num" style="font-size:${size}px;color:${color};">${scoreText}</span>${numeric?`<span class="num" style="font-size:${slashSize}px;font-weight:700;color:#0B1640;">/ 100</span>`:''}</span>
    ${status}${coverage}
  </div>`;
}
function analysisHeader(d, opts){
  const o = opts || {};
  const subtitle = dotSep(d.sub || d.meta || '');
  const findingLine = d.findingsLine ? `<div style="font-size:18px;color:#0B1640;margin-top:6px;line-height:1.35;">${findingLineHTML(d.findingsLine)}</div>` : '';
  const headerRow = `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:24px;">
    <div style="min-width:0;flex:1;"><div class="title">${d.title}</div>${subtitle?`<div style="font-size:18px;color:#0B1640;margin-top:6px;line-height:1.35;white-space:normal;">${subtitle}</div>`:''}${findingLine}</div>
    ${scoreLockup(d, o.scoreSize || 48, {statusWord: !!o.statusWord})}
  </div>`;
  const fill = d.barColor ? standardStatusColor(d.barColor) : scoreColor(d);
  const pct = d.barPct!=null ? d.barPct : (typeof d.score === 'number' ? d.score : 0);
  const bar = o.bar ? `<div style="margin-top:16px;height:10px;border-radius:999px;background:#F0F2F5;overflow:hidden;">${scoreFill(pct, fill)}</div>` : '';
  const body = `${headerRow}${bar}`;
  if(o.padded){
    return `<div style="padding:22px 24px;border-bottom:1px solid #E3E9F1;">${body}</div>`;
  }
  return `${body}<div class="rule"></div>`;
}

// ---- MINI REPORT SCORE (Design 10-20, Section 3) ----
// The Client Performance, FillDB and PerfMon Infographics carry their own scoring
// legend: a larger score with its status word, the score bar with ticks at 70 and
// 90 and the three ranges named under it, and one scoring line at the foot of the
// card. Design gave sizes at a 940 px card; the card here is 2250 px, so each is
// multiplied by 2.39. The Mini Report modules score on 90 and 70.
function miniScoreLockup(score, color, word){
  return `<div style="display:flex;flex-direction:column;align-items:flex-end;flex:none;">
    <div style="display:flex;align-items:baseline;gap:14px;white-space:nowrap;"><div style="font-size:153px;font-weight:800;color:${color};line-height:1;">${fmtCount(score)}</div><div style="font-size:43px;font-weight:700;color:#0B1640;">/ 100</div></div>
    <div style="font-size:31px;font-weight:700;letter-spacing:0.14em;color:${color};margin-top:5px;text-transform:uppercase;white-space:nowrap;">${srcText(word)}</div>
  </div>`;
}
function miniScoreScale(pct, color, middleName){
  const fill = clampPct(Number(pct) || 0);
  const radius = fill >= 100 ? '999px' : '999px 0 0 999px';
  return `<div style="position:relative;margin-top:38px;height:48px;background:#F0F2F5;border-radius:999px;">
    <div style="position:absolute;left:0;top:0;width:${fill}%;height:48px;background:${color};border-radius:${radius};"></div>
    <div style="position:absolute;left:70%;top:-12px;width:5px;height:72px;background:#0B1640;"></div>
    <div style="position:absolute;left:90%;top:-12px;width:5px;height:72px;background:#0B1640;"></div>
  </div>
  <div style="display:flex;margin-top:19px;font-size:31px;line-height:1.3;color:#0B1640;">
    <div style="width:70%;"><strong>Critical</strong><br>0 to 69</div>
    <div style="width:20%;"><strong>${middleName}</strong><br>70 to 89</div>
    <div style="width:10%;text-align:right;white-space:nowrap;"><strong>Healthy</strong><br>90 to 100</div>
  </div>`;
}
function miniScoringLine(text, source){
  if(!text && !source) return '';
  const sourceLine = source ? `<div style="font-size:33px;color:#000032;line-height:1.4;">${srcText(source)}</div>` : '';
  const scoringLine = text ? `<div style="font-size:33px;color:#000032;line-height:1.4;${source?'margin-top:10px;':''}">${srcText(text)}</div>` : '';
  return `<div style="height:2px;background:#E3E9F1;margin:38px 0 29px 0;"></div>
  ${sourceLine}${scoringLine}`;
}

// ---- LOOP ----
function loopMeta(text){
  return dotSep(String(text || '')
    .replace(/\bcollection\s+(\d+)\s+days?\b/ig,'$1 day collection'));
}
function loopLegendLabel(label){
  return String(label || '')
    .replace(/^Needs Attention\b/i,'Warning')
    .replace(/\s*<\s*/g,' under ')
    .replace(/\s*>\s*/g,' over ')
    .replace(/\s*\/\s*no data\b/ig,'')
    .replace(/\s+/g,' ')
    .trim();
}
function normalizedLoopFooter(d){
  const rows = (d.footer || []).slice();
  const isReported = f => /^reported$/i.test(String(f.label || '').trim());
  const avg = rows.find(f=>/average/i.test(f.label || ''));
  const slow = rows.find(f=>/slowest/i.test(f.label || ''));
  const severe = rows.find(f=>/severe/i.test(f.label || ''));
  const out = [];
  if(avg) out.push(avg);
  out.push(slow || {label:'Slowest Evaluation', value:'Not available'});
  if(severe) out.push(severe);
  rows.forEach(f=>{ if(!out.includes(f) && !isReported(f)) out.push(f); });
  return out.slice(0,3);
}
function normalizedLoopContext(d){
  const context = (d.context || []).slice();
  const reported = (d.footer || []).find(f=>/^reported$/i.test(String(f.label || '').trim()));
  if(reported && !context.some(c=>/devices reporting/i.test(c.label || ''))){
    const value = `${reported.value || ''}${reported.sub ? ` ${reported.sub}` : ''}`.trim();
    context.unshift({label:'Devices Reporting', value});
  }
  if(!context.some(c=>/no udp pings/i.test(c.label || ''))){
    context.push({label:'No UDP Pings Received', value:'Not available', caption:'No UDP rollup recorded'});
  }
  if(!context.some(c=>/relay(?:s)?\s+(?:w\/\s+most|with)\s+udp issues/i.test(c.label || ''))){
    context.push({label:'Relay With Most UDP Issues', value:'Not available', caption:'No relay rollup recorded'});
  }
  return context.slice(0,3);
}
function buildLoop(d){
  const context = normalizedLoopContext(d);
  const reporting = context.find(c=>/devices reporting/i.test(String(c.label || '')));
  const reportingCount = String(reporting && reporting.value || '').match(/\d[\d,]*/);
  let meta = loopMeta(d.meta || '');
  if(reportingCount && !/\breporting\b/i.test(meta)){

  return `<div id="c-loop" style="width: 2250px; background: #ffffff; border: 1px solid #E3E9F1; border-radius: 14px; padding: 44px 48px 48px 48px;">
    <div style="display: flex; align-items: flex-start; justify-content: space-between;">

      </div>

      ${(d.dist || []).map((s,i)=>{const items=d.dist || [];const first=i===0,last=i===items.length-1;const radius=items.length===1?'999px':first?'999px 0 0 999px':last?'0 999px 999px 0':'0';const width=s.width || (s.pct!=null ? `${s.pct}%` : '0%');const color=standardStatusColor(s.color || '#5B677A');const count=s.count ?? s.num ?? '';const fill=s.hatch?`repeating-linear-gradient(45deg, ${color} 0 10px, #ffffff 10px 16px)`:color;return `<div style="border-radius: ${radius}; width: ${width}; background: ${fill}; display: flex; align-items: center; padding-left: 16px; color: #ffffff; font-weight: 700; font-size: 38px;">${count}</div>`;}).join('')}

// ---- SCORING SUMMARY ----

// ---- DEPLOYMENT HEALTH BALANCE ----
function balRow([name,score,find,split]){
  // Not Assessed (null score): keep the exact same grid, just drop the bar and
  // show a smaller muted "Not Assessed" where the number would be -- never a
  // misleading 0/red bar or "null".
  if(score==null){
    return `<div style="display:grid;grid-template-columns:440px minmax(0,1fr) 170px 620px;align-items:center;gap:18px;margin-bottom:8px;">

    <div style="height:17px;background:#F0F2F5;border-radius:999px;overflow:hidden;">${scoreFill(score, barOf[b])}</div>
    <span style="display:flex;align-items:center;justify-content:flex-start;gap:12px;min-width:0;">
      <span data-single-line="score-label" class="num" style="font-weight:800;font-size:18px;color:${barOf[b]};white-space:nowrap;">${score}</span>
    </span>
    <span data-single-line="findings-split" class="num metricCaption" style="font-size:14px;color:#0B1640;text-align:right;white-space:nowrap;">${impactSplitHTML(split)}</span>
  </div>`;
}
function balGroup(g){
  // A whole pillar can be Not Assessed or Partially Assessed (null score) -- show
  // that instead of a medal; a partial pillar also shows how much was covered so
  // a 1-of-5 clean pillar can never read as a confident full-pillar rating.
  const {title,score,cov,catCount,findingCount,coverageLine} = g;
  const partial = cov && cov.state==='partial';
  const color = score==null ? '#0B1640' : barOf[bandOf(score)];
  const right = score==null
    ? `<span class="num" style="font-size:14px;color:#0B1640;">${covLabel(cov)}${partial?` (${fmtCount(cov.assessed)} of ${fmtCount(cov.total)})`:''}</span>`
    : `<span style="font-weight:800;font-size:17px;color:${color};">${tierOf(score)}</span><span class="num" style="font-weight:800;font-size:17px;color:#0B1640;">${score}<span style="color:#0B1640;font-size:14px;font-weight:700;"> /100</span></span>`;
  // Roll-up counts (the old separate Scoring Summary card's unique content,
  // folded in here per Fix 2 so there is only one summary graphic).
  const rollup = (catCount!=null && findingCount!=null)
    ? `<span class="num" style="font-size:14px;color:#0B1640;margin-left:10px;">${coverageLine || `${fmtCount(catCount)} of ${fmtCount(catCount)} categor${catCount===1?'y':'ies'} assessed`}, ${fmtCount(findingCount)} finding${findingCount===1?'':'s'}</span>`
    : '';
  return `<div style="display:flex;justify-content:space-between;align-items:center;background:#F0F2F5;border-radius:9px;padding:9px 18px;margin:12px 0 9px;">
    <span>${title?`<span style="font-weight:800;font-size:16px;color:#0B1640;">${title}</span>`:''}${rollup}</span>
    <span style="display:flex;align-items:center;gap:14px;">${right}</span>
  </div>`;
}
function buildBalance(d){
  // Single legend, score states only (Advisory is per-finding, never a score band).
  // ones), sourced from SPINE so it can never drift from the bands the bars and
  // chips actually use.
  const legend = ['Healthy','Needs Attention','Critical','Not Assessed'].map(w=>{
    const s = SPINE[w];
    const label = s.band ? `${w} (${s.band})` : w;
    return `<span style="display:inline-flex;align-items:center;gap:9px;font-size:14.5px;color:#0B1640;"><span style="width:12px;height:12px;border-radius:50%;background:${s.mark};"></span>${label}</span>`;
  }).join('');
  const sortAsc=a=>a.slice().sort((x,y)=>(x[1]??1e9)-(y[1]??1e9));  // Not Assessed (null) sorts last
  const rows = d.groups.map(g=>balGroup(g)+sortAsc(g.cats).map(balRow).join('')).join('');
  const headerPayload = Object.assign({}, d, {coverageLine:''});
  return header(d.title, d.sub, d.score!=null ? scoreLockup(headerPayload,50,{statusWord:true}) : `<span style="font-weight:800;color:#0B1640;">${d.overallTier||'Not Assessed'}</span>`)
    + `<div style="display:flex;gap:26px;margin:6px 0 14px;flex-wrap:wrap;">${legend}</div>`
    + `<div>${rows}</div>`;
}

// ---- KEY RISKS ----
// Ranked triage cards (Fix: What Needs Attention becomes an explicit P1..Pn
// order). The pill is the card's position in the ranked list, not the
// finding's own severity tier -- two Critical-severity findings can rank
// #1 and #2 side by side, each keeping its own severity badge next to area.
// Impact/Action are capped at 2 lines each (line-clamp) so a card's height
// stays predictable regardless of how verbose the underlying finding text
// is. The report chart receives only the capped top rows from get_key_risks.py
// and sends any larger remainder to Findings.
function riskCard(r){
  const b = r.band;
  const pillBg = b==='critical' ? SPINE['Critical'].bg : SPINE['Needs Attention'].bg;
  const pillColor = b==='critical' ? SPINE['Critical'].text : SPINE['Needs Attention'].text;
  return `<div style="border:1px solid #E3E9F1;border-radius:9px;padding:12px 18px;">
    <div style="display:grid;grid-template-columns:150px minmax(0,1fr) 150px;align-items:center;gap:18px;">
      <span style="display:inline-flex;align-items:center;justify-content:center;background:${pillBg};color:${pillColor};font-size:15px;font-weight:800;border-radius:999px;padding:9px 12px;">${r.severity}</span>
      <div style="min-width:0;">
        <div style="font-weight:800;font-size:17px;color:#0B1640;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${r.title}</div>
        <div style="margin-top:3px;font-size:15px;color:#0B1640;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${r.action||''}</div>
      </div>
      <span data-single-line="source-id" class="num" style="justify-self:end;background:#F0F2F5;border-radius:6px;padding:8px 10px;font-size:14px;font-weight:800;color:#0B1640;white-space:nowrap;min-width:124px;text-align:center;">${r.idCitation||''}</span>
    </div>
  </div>`;
}
function buildRisks(d){
  const rows = d.risks.map(riskCard).join('');
  const shown = d.risks.length;
  const hiddenRaw = countNumber(d.hiddenCount);
  const declaredTotal = countNumber(d.count);
  const hidden = Number.isFinite(hiddenRaw)
    ? Math.max(hiddenRaw, 0)
    : Math.max((Number.isFinite(declaredTotal) ? declaredTotal : shown) - shown, 0);
  const total = shown + hidden;
  const medium = Math.max(countNumber(d.mediumCount) || 0, 0);
  const low = Math.max(countNumber(d.lowCount) || 0, 0);
  const more = hidden > 0
    ? `<div style="font-size:14px;color:#0B1640;text-align:left;margin-top:7px;">${fmtCount(medium)} Medium and ${fmtCount(low)} Low in Findings and Recommendations.</div>`
    : '';
  const defaultSub = `Prioritized remediation items &middot; ${fmtCount(total)} items &middot; Source ID traces each to its check`;
  const sub = /IDs on each card/i.test(String(d.sub || '')) ? defaultSub : (d.sub || defaultSub);
  return header(d.title, sub, '')
    + `<div style="display:flex;flex-direction:column;gap:8px;">${rows}</div>${more}`;
}

// ---- WHAT'S WORKING WELL ----
// Two groups, both gated on the category's own score (Fix 8): Platform
// Health and Operational Maturity areas scored 85+ appear here. Never driven
// by passing-check volume, so this section can't disagree with the Section 04
// scorecard.
function groupCaption(label, scoreSub){
  return `<div class="eyebrow" style="margin:14px 0 10px;">
    ${label||''}${scoreSub!=null?` <span class="num" style="font-weight:700;font-size:14px;color:#0B1640;">(${scoreSub}/100)</span>`:''}
  </div>`;
}
function cleanStrengthEvidence(evidence){
  return String(evidence || '')
    .replace(/License and version posture are healthy\./ig,'License and version checks are healthy.')
    .replace(/\bposture\b/ig,'status');
}
function healthyRow([name,score,evidence]){
  const hasScore = score!==null && score!==undefined && score!=='';
  const b=hasScore ? bandOf(Number(score)) : 'healthy';
  const cleanEvidence = cleanStrengthEvidence(evidence);
  return `<div style="display:grid;grid-template-columns:180px minmax(0,1fr) 70px;align-items:center;gap:16px;border:1px solid #E3E9F1;border-radius:12px;padding:10px 18px;margin-bottom:8px;">
    <span style="display:inline-flex;align-items:center;justify-content:center;background:${SPINE['Healthy'].bg};color:${SPINE['Healthy'].text};font-size:15px;font-weight:800;border-radius:999px;padding:8px 12px;">Healthy</span>
    <span style="min-width:0;"><span class="metricLabel" style="font-weight:800;font-size:17px;color:#0B1640;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${name}</span>${cleanEvidence?`<span class="metricCaption" style="font-size:15px;color:#0B1640;line-height:1.2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${cleanEvidence}</span>`:''}</span>
    <span class="num" style="font-weight:800;font-size:26px;color:${barOf[b]};text-align:right;">${hasScore?fmtCount(score):''}</span>
  </div>`;
}
function omPill([name,score]){
  return healthyRow([name,score,'']);
}
function buildStrengths(d){
  const healthy = d.healthyGroup||{rows:[]};
  const om = d.omGroup||{pills:[]};
  const title = String(d.title || "What's Working Well").replace(/^What is Working Well$/,"What's Working Well");
  const platformLabel = /^healthy$/i.test(String(healthy.label || ''))
    ? `Platform Health &middot; ${fmtCount(healthy.rows.length)} area${healthy.rows.length===1?'':'s'}`
    : healthy.label;
  const omLabel = /^healthy$/i.test(String(om.label || ''))
    ? `Operational Maturity &middot; ${fmtCount(om.pills.length)} area${om.pills.length===1?'':'s'}`
    : om.label;
  const shownAreaCount = (healthy.rows || []).length + (om.pills || []).length;
  const declaredAreaCount = countNumber(d.areaCount);
  const areaCount = shownAreaCount || (Number.isFinite(declaredAreaCount) ? declaredAreaCount : 0);
  const subtitle = d.sub || `Areas scoring 85 or higher &middot; ${fmtCount(areaCount)} qualified`;
  const showEmpty = !d.hideEmptyGroups;
  const healthyRows = healthy.rows.length
    ? healthy.rows.map(healthyRow).join('')
    : `<div style="padding:13px 0;font-size:15px;color:#0B1640;">No Platform Health areas scored 85 or higher.</div>`;
  const omPills = om.pills.length
    ? `<div>${om.pills.map(omPill).join('')}</div>`
    : `<div style="padding:2px 0 13px;font-size:15px;color:#0B1640;">No Operational Maturity areas scored 85 or higher.</div>`;
  return header(title,subtitle,'')
    +(healthy.rows.length||showEmpty ? groupCaption(platformLabel)+`<div>${healthyRows}</div>` : '')
    +(om.pills.length||showEmpty ? groupCaption(omLabel)+omPills : '');
}

// ---- status palette for KPI pills (Deployment Overview) ----
const statusInfo = Object.fromEntries(
  ['Healthy','Advisory','Needs Attention','Critical','Not Assessed'].map(
    w => [w, {fg:SPINE[w].text, bg:SPINE[w].bg, dot:SPINE[w].mark}]
  )
);
function overviewStatusWord(k){
  const explicit = statusWordFromLabel(k && k.status);
  if(explicit && explicit !== 'Advisory') return explicit;
  const numeric = Number(String((k && (k.big || k.width)) || '').replace(/[^0-9.]/g,''));
  return Number.isFinite(numeric) ? tierOf(numeric) : 'Not Assessed';
}

// ---- FILLDB PERFORMANCE (design-system after) ----
function buildFilldb(d){
  const payload = Object.assign({}, d, {title: String(d.title || 'FillDB Health Score').replace(/^FillDB health score$/,'FillDB Health Score')});
  const filldbDot = '·';
  const filldbStatusColor = item => {
    const label = String(item && item.label || '');
    if(/^Great\b/i.test(label)) return '#187A43';
    if(/^Good\b/i.test(label)) return '#187A43';
    if(/^Poor\b/i.test(label)) return '#C2410C';
    if(/^No Data\b/i.test(label)) return '#F0F2F5';
    const key = hexKey(item && (item.color || item.dot || item.css));
    if(['0B1640','5B677A','8A93A3'].includes(key)) return '#F0F2F5';
    if(key === 'D88A0A') return '#C2410C';
    return standardStatusColor(item && (item.color || item.dot || item.css) || '#F0F2F5');
  };
  const filldbTextColor = item => filldbStatusColor(item) === '#F0F2F5' ? '#0B1640' : '#ffffff';
  const filldbDisplayLabel = label => {
    const raw = String(label || '').replace(/:$/,'').trim();
    const map = {
      'short property results':'Short property results',
      'long property results':'Long property results',
      'action results':'Action results',
      'computer properties':'Computer properties',
      'computer administrators':'Computer administrators',
      'computer roles':'Computer roles',
      'computer sequences':'Computer sequences',
      'dynamic computer groups':'Dynamic computer groups',
      'computer sites subscription':'Computer sites subscription',
      'computer relay statuses':'Computer relay statuses',
    };
    return map[raw.toLowerCase()] || raw;
  };
  const filldbLegendName = item => {
    const text = String(item && item.label || '').replace(/&middot;.*$/,'').replace(/·.*$/,'').trim();
    if(/^Great\b/i.test(text)) return 'Healthy';
    if(/^Good\b/i.test(text)) return 'Healthy';
    if(/^Poor\b/i.test(text)) return 'Critical';
    if(/^No Data\b/i.test(text)) return 'Not Assessed';
    return filldbDisplayLabel(text);
  };
  const filldbIsNotAssessed = item => filldbStatusColor(item) === '#F0F2F5';
  const score = payload.score;
  const scoreFill = standardStatusColor(payload.scoreColor || payload.barColor || scoreColor(payload));
  const scorePct = Number.isFinite(Number(payload.barPct)) ? Number(payload.barPct) : Number(score);
  const distItems = d.dist || [];
  const dist = distItems.map((x,i)=>{
    const width = x.width || '0%';
    const widthPct = parseFloat(String(width || '0'));
    const showCount = widthPct >= 8;
    const first=i===0,last=i===distItems.length-1;
    const radius=distItems.length===1?'999px':first?'999px 0 0 999px':last?'0 999px 999px 0':'0';
    return `<div style="border-radius: ${radius}; width: ${width}; background: ${filldbStatusColor(x)}; display: flex; align-items: center; padding-left: ${showCount?'16px':'0'}; color: ${filldbTextColor(x)}; font-weight: 700; font-size: 38px;">${showCount?fmtCount(x.count):''}</div>`;
  }).join('');
  const legend = distItems.map(x=>{
    const dotBorder = filldbIsNotAssessed(x) ? ' border: 1px solid #E3E9F1;' : '';
    return `<div style="display: flex; align-items: center; gap: 10px;"><span style="width: 14px; height: 14px; border-radius: 7px; background: ${filldbStatusColor(x)};${dotBorder}"></span>${srcText(filldbLegendName(x))} ${filldbDot} <span style="font-weight: 700;">${fmtCount(x.count)}</span></div>`;
  }).join('');
  const shortBatch = (d.bars || []).find(b => filldbDisplayLabel(b.label) === 'Parallel DB Update (Short Batch)');
  const workloadItems = (d.bars || []).filter(b => {
    if(filldbDisplayLabel(b.label) !== 'Batch Rate') return true;
    return !(shortBatch && String(shortBatch.mins) === String(b.mins) && String(shortBatch.width) === String(b.width) && hexKey(shortBatch.color) === hexKey(b.color));
  });
  const workloadRows = workloadItems.map(b=>{
    const label = filldbDisplayLabel(b.label);
    const notAssessed = filldbIsNotAssessed(b);
    const color = notAssessed ? '#0B1640' : filldbStatusColor(b);
    const minutes = String(b.mins ?? '').trim();
    const pct = parseFloat(String(b.width || '0'));
    const fillWidth = pct > 0 && pct < 4 ? '40px' : (pct > 0 ? (b.width || '0%') : '0');
    const fill = (!notAssessed && pct > 0) ? `<div style="width: ${fillWidth}; height: 100%; border-radius: 999px; background: ${color};"></div>` : '';
    const value = notAssessed
      ? `<div style="width: 320px; white-space: nowrap; font-size: 38px; text-align: right; flex: 0 0 auto;">Not assessed</div>`
      : `<div style="width: 320px; white-space: nowrap; font-size: 38px; font-weight: 700; color: ${color}; text-align: right; flex: 0 0 auto;">${srcText(minutes)}m</div>`;
    return `<div style="display: flex; align-items: center; gap: 24px;">
      <div style="width: 640px; font-size: 38px; flex: 0 0 auto;">${srcText(label)}</div>
      <div style="flex: 1; height: 40px; border-radius: 999px; background: #F0F2F5; overflow: hidden;">${fill}</div>
      ${value}
    </div>`;
  }).join('');
  return `
<div style="width: 2250px; background: #ffffff; border: 1px solid #E3E9F1; border-radius: 14px; padding: 44px 48px 48px 48px;">
  <div style="display: flex; align-items: flex-start; justify-content: space-between;">
    <div>
      <div style="font-size: 64px; font-weight: 700; color: #0B1640;">${srcText(payload.title)}</div>
      <div style="font-size: 38px; color: #0B1640; margin-top: 8px;">${srcText(payload.meta)}</div>
    </div>
    ${miniScoreLockup(score, scoreFill, scoreStatusWord(payload))}
  </div>
  ${miniScoreScale(scorePct, scoreFill, 'Needs Attention')}
  <div style="height: 1px; background: #E3E9F1; margin-top: 28px;"></div>

  <div style="font-size: 38px; font-weight: 700; color: #0C7E88; letter-spacing: 0.08em; margin-top: 30px; text-transform: uppercase;">${dotSep(d.distLabel)}</div>
  <div style="display: flex; height: 40px; margin-top: 16px; border-radius: 999px; overflow: hidden;">
    ${dist}
  </div>
  <div style="display: flex; align-items: center; gap: 34px; margin-top: 16px; font-size: 38px; color: #0B1640;">
    ${legend}
  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 36px;">
    <div style="font-size: 38px; font-weight: 700; color: #0C7E88; letter-spacing: 0.08em; text-transform: uppercase;">${dotSep(d.barsLabel)}</div>
    <div style="font-size: 38px; color: #0B1640;">Bar length is minutes. Color is health.</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 16px;">
    ${workloadRows}
  </div>

  ${miniScoringLine(d.scoringLine)}
</div>
  `;
}

// ---- EXECUTIVE SNAPSHOT HEADLINE CARDS ----

const SNAPSHOT_PILL_CLS = {'Healthy':'st-healthy','Needs Attention':'st-attention','Critical':'st-critical'};
const SNAPSHOT_MUTED = '#0B1640';
function snapshotPill(tier){

    return statusPill('st-notassessed', 'Not Assessed', {small:true,dotSize:8,detail:false});

}
function snapshotScoreCard(label, score, footnote){

  const numericScore = hasScore ? Number(score) : null;

    ${figure}

    <div style="font-size:48px;font-weight:700;color:${tierColor};line-height:1.15;margin-top:14px;">${tier||'Not Assessed'}</div>
    ${footnote?`<div style="font-size:38px;line-height:1.15;color:#0B1640;margin-top:8px;">${dotSep(footnote)}</div>`:''}

}
function snapshotFindingsCard(f){

function buildSnapshot(d){

// ---- Source transcription overrides (charts 2-9, 11-12) ----
// Chart 1 is intentionally not overridden here. Executive Snapshot is already
// source-shaped and remains untouched by this block.
const SRC_INK = '#000032';
const SRC_TEAL = '#0C7E88';
const SRC_HEALTHY = '#187A43';
const SRC_ATTENTION = '#B45309';
const SRC_CRITICAL = '#C2410C';
const SRC_NOT_ASSESSED = '#5B677A';
const SRC_TRACK = '#F0F2F5';
const SRC_LINE = '#E3E9F1';
const SRC_HEALTHY_BG = '#D5F5E3';
const SRC_ATTENTION_BG = '#FFF8E7';
const SRC_CRITICAL_BG = '#FDECEA';
const SRC_DOT = '&middot;';

function srcText(v){
  return dotSep(esc(v).replace(/&amp;middot;/g, '&middot;'));
}
function srcBand(score){
  if(score==null || score==='') return 'notassessed';
  return bandOf(Number(score));
}
function srcColor(score){
  const b = srcBand(score);
  return b==='healthy' ? SRC_HEALTHY : b==='attention' ? SRC_ATTENTION : b==='critical' ? SRC_CRITICAL : SRC_NOT_ASSESSED;
}
function srcTier(score, fallback){
  if(score==null || score==='') return fallback || 'Not Assessed';
  return tierOf(Number(score));
}
function srcFillWidth(score){
  if(score==null || score==='') return '0%';
  const pct = clampPct(score);
  return `${pct === 0 ? 1 : pct}%`;
}
function srcHeader(title, sub, right){
  return `<div style="display:flex;align-items:flex-start;justify-content:space-between;">
      <div>
        <div style="font-size:64px;font-weight:700;color:${SRC_INK};">${srcText(title)}</div>
        <div style="font-size:38px;color:${SRC_INK};margin-top:8px;">${srcText(sub)}</div>
      </div>
      ${right || ''}
    </div>`;
}
function srcScoreRight(score, tier){
  const color = srcColor(score);
  if(score==null || score===''){
    return `<div style="text-align:right;"><div style="font-size:56px;font-weight:700;color:${SRC_NOT_ASSESSED};line-height:1;">Not Assessed</div></div>`;
  }
  return `<div style="text-align:right;">
      <div style="display:flex;align-items:baseline;gap:6px;justify-content:flex-end;">

        <div style="font-size:38px;font-weight:700;color:${SRC_INK};">/ 100</div>
      </div>
      <div style="font-size:44px;font-weight:700;color:${color};margin-top:8px;">${srcTier(score, tier)}</div>
    </div>`;
}
function srcScoreBar(score, fillColor){
  if(score==='') score = null;
  const meterColor = fillColor ? standardStatusColor(fillColor) : srcColor(score);
  return `<div style="height:40px;border-radius:999px;background:${SRC_TRACK};margin-top:22px;overflow:hidden;">${score==null?'':scoreFill(score, meterColor)}</div>`;
}
function srcRule(top){
  return `<div style="height:1px;background:${SRC_LINE};margin-top:${top || 28}px;"></div>`;
}
function srcEyebrow(label, marginTop){
  return `<div style="font-size:38px;font-weight:700;color:${SRC_TEAL};letter-spacing:0.08em;margin-top:${marginTop || 30}px;">${srcText(label).toUpperCase()}</div>`;
}
function srcSplit(split, summary){
  const colors = summary
    ? {critical:SRC_CRITICAL, high:SRC_CRITICAL, medium:SRC_ATTENTION, low:SRC_INK}
    : {critical:SRC_CRITICAL, high:SRC_ATTENTION, medium:SRC_INK, low:SRC_INK};
  const parts = IMPACT_ORDER
    .map(k => [k, countNumber((split || {})[k] || 0)])
    .filter(([,n]) => n > 0);
  if(!parts.length) return 'clean';
  return parts.map(([k,n]) => `<span style="font-weight:700;color:${colors[k]};">${fmtCount(n)}</span> ${IMPACT_LABEL[k]}`).join(` ${SRC_DOT} `);
}
function srcSplitTotal(split){
  return IMPACT_ORDER.reduce((acc,k)=>acc + Math.max(countNumber((split || {})[k] || 0), 0), 0);
}
function srcFooter(label, line){
  return `<div style="height:1px;background:${SRC_LINE};margin:34px 0 26px 0;"></div>
    <div style="font-family:'Aptos',sans-serif;font-weight:700;font-size:38px;letter-spacing:0.06em;text-transform:uppercase;color:${SRC_TEAL};">${srcText(label)}</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">${line}</div>`;
}
function srcFindingSummaryLine(content){
  return `<div data-single-line="findings-split" style="font-size:38px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${content}</div>`;
}
function srcFindingIds(ids){
  const raw = Array.isArray(ids) ? ids : String(ids || '').split(/[,;]/);
  const clean = [];
  raw.forEach(id => {
    const text = String(id || '').trim().toUpperCase();
    if(text && !clean.includes(text)) clean.push(text);
  });
  return clean;
}
function srcFindingIdList(ids){
  const clean = srcFindingIds(ids);
  return clean.length ? `<span><strong>IDs</strong> ${clean.map(srcText).join(', ')}</span>` : '';
}
function srcFindingIdPreview(ids, limit){
  const clean = srcFindingIds(ids);
  const max = Math.max(Number(limit) || 0, 1);
  if(!clean.length) return '';
  const shown = clean.slice(0, max).map(srcText).join(', ');
  const more = clean.length > max
    ? ` ${SRC_DOT} +${fmtCount(clean.length - max)} more below`
    : '';
  return `<span><strong>Unique Source IDs</strong> ${shown}${more}</span>`;
}
function srcFindingDetailLine(content){
  return `<div style="font-size:38px;line-height:1.35;">${content}</div>`;
}
// Dates read MM-DD-YYYY in every Infographic subtitle (Design 10-20, Section 4).
const SRC_MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function srcMdy(day, month, year){
  const index = SRC_MONTHS.indexOf(String(month || '').slice(0,3).toLowerCase());
  if(index < 0) return null;
  return `${String(index + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}-${year}`;
}
function srcMdyText(text){
  return String(text || '').replace(
    /\b(?:Sun|Mon|Tue|Wed|Thu|Fri|Sat),?\s+(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})\b/g,
    (whole, day, month, year) => srcMdy(day, month, year) || whole);
}
function srcDate(text){
  const m = String(text || '').match(/\b(?:Sun|Mon|Tue|Wed|Thu|Fri|Sat),?\s+(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})/);
  return m ? (srcMdy(m[1], m[2], m[3]) || m[0].replace(',', '')) : srcText(text);
}

function srcDashboardDistCount(d, matcher){
  const row = (d.dist || []).find(([label]) => matcher(String(label || '').toLowerCase()));
  return row ? Math.max(countNumber(row[1]) || 0, 0) : 0;
}
function srcDashboardFindingLine(d){
  const warning = srcDashboardDistCount(d, label => label.includes('attention') || label.includes('warning'));
  const failed = srcDashboardDistCount(d, label => label.includes('fail'));
  const total = warning + failed;
  if(total <= 0){
    return srcFindingSummaryLine('None raised.');
  }
  const parts = [];
  if(failed){
    parts.push(`<span><strong style="color:${SRC_CRITICAL};">${fmtCount(failed)}</strong> failed</span>`);
  }
  if(warning){
    parts.push(`<span><strong style="color:${SRC_ATTENTION};">${fmtCount(warning)}</strong> needs attention</span>`);
  }
  const ids = srcFindingIdList(d.findingIds);
  if(ids){
    parts.unshift(ids);
  }
  const totalColor = failed ? SRC_CRITICAL : SRC_ATTENTION;
  return srcFindingSummaryLine(`<strong style="color:${totalColor};">${fmtCount(total)}</strong> total ${SRC_DOT} ${parts.join(` ${SRC_DOT} `)}`);
}
function srcPerfmonFindingLine(d){
  const summary = d.findingsSummary || {};
  const ids = srcFindingIdList(d.findingIds);
  let critical = Math.max(countNumber(summary.critical || summary.failed || 0) || 0, 0);
  let warning = Math.max(countNumber(summary.warning || summary.needsAttention || 0) || 0, 0);
  const cannotVerify = Math.max(countNumber(summary.cannotVerify || 0) || 0, 0);
  let total = Math.max(countNumber(summary.total || 0) || 0, 0);
  if(total <= 0 && critical + warning + cannotVerify <= 0){
    const outside = (d.counters || []).filter(row => {
      const result = String((row || [])[3] || '').toLowerCase();
      return result && !['ok','pass','passed','healthy'].includes(result);
    }).length;
    if(outside <= 0){
      return srcFindingSummaryLine('None raised.');
    }
    const outsideLine = `<strong style="color:${SRC_CRITICAL};">${fmtCount(outside)}</strong> total ${SRC_DOT} <strong style="color:${SRC_CRITICAL};">${fmtCount(outside)}</strong> outside thresholds`;
    return ids ? srcFindingSummaryLine(outsideLine) + srcFindingSummaryLine(ids) : srcFindingSummaryLine(outsideLine);
  }
  total = total || critical + warning + cannotVerify;
  const parts = [];
  if(critical){
    parts.push(`<span><strong style="color:${SRC_CRITICAL};">${fmtCount(critical)}</strong> critical</span>`);
  }
  if(warning){
    parts.push(`<span><strong style="color:${SRC_ATTENTION};">${fmtCount(warning)}</strong> advisory</span>`);
  }
  if(cannotVerify){
    parts.push(`<span><strong style="color:#000032;">${fmtCount(cannotVerify)}</strong> cannot verify</span>`);
  }
  const totalColor = critical ? SRC_CRITICAL : SRC_ATTENTION;
  const summaryLine = [`<strong style="color:${totalColor};">${fmtCount(total)}</strong> total`, parts.join(` ${SRC_DOT} `)].filter(Boolean).join(` ${SRC_DOT} `);
  return ids ? srcFindingSummaryLine(summaryLine) + srcFindingSummaryLine(ids) : srcFindingSummaryLine(summaryLine);
}

function srcPerfmonCaption(name, threshold){
  const lower = String(threshold || '').toLowerCase();
  if(/~?5,?000\/s/.test(lower)) return 'Capacity near 5,000 per second.';
  if(/approach zero/.test(lower)) return 'Errors should approach zero.';
  if(/page file/.test(lower)) return 'Limit 5% page file use.';
  if(/cpu time/.test(lower)) return `Limit ${String(threshold).replace(/^limit\s*/i,'').replace(/\s*\(cpu time\)/i,'')} of CPU time.`;
  return `${String(threshold || '').replace(/^limit/i,'Limit').replace(/(\d)ms/i,'$1 ms')}.`.replace(/\.\.$/,'.');
}
function buildPerfmon(d){
  const score = d.score;
  const color = standardStatusColor(d.scoreColor || srcColor(score));
  const right = miniScoreLockup(score, color, scoreStatusWord(d));
  const cards = (d.counters || []).map(([name,peak,thr,res])=>`
    <div style="border:1px solid ${SRC_LINE};border-radius:12px;padding:22px 24px;">
      <div style="font-size:38px;font-weight:700;letter-spacing:0.04em;">${srcText(name).toUpperCase()}</div>
      <div style="font-size:64px;font-weight:700;color:${res==='fail'?SRC_CRITICAL:res==='cannot'?SRC_INK:SRC_HEALTHY};margin-top:10px;">${srcText(peak)}</div>
      <div style="font-size:38px;margin-top:8px;">${srcText(res==='cannot'?(/memory/i.test(name)?'Cannot verify without physical memory.':'Cannot verify.'):srcPerfmonCaption(name, thr))}</div>
    </div>`).join('');
  return srcHeader('PerfMon Counters', `${(d.counters || []).length} checks against thresholds &middot; values are capture averages`, right)
    + miniScoreScale(score, color, 'Needs Attention')
    + srcRule(28)

    + srcFooter('Findings raised', srcPerfmonFindingLine(d))
    + miniScoringLine(d.scoringLine, d.sourceLine);
}

// Section Health lists only the counts that are not zero, so no row wraps and
// leaves a separator at the start of its second line (Design 10-20, Section 4).
function srcSectionCounts(p, w, f){
  const parts = [];
  if(Number(p) > 0) parts.push(`${fmtCount(p)} passed`);
  if(Number(w) > 0) parts.push(`<span style="font-weight:700;color:${SRC_ATTENTION};">${fmtCount(w)} needs attention</span>`);
  if(Number(f) > 0) parts.push(`<span style="font-weight:700;color:${SRC_CRITICAL};">${fmtCount(f)} failed</span>`);
  return parts.length ? parts.join(` ${SRC_DOT} `) : '0 passed';
}
function buildDashboard(d){
  const word = statusWordFromClass(d.status && d.status.cls, d.status && d.status.label);
  const evaluated = d.kpis && d.kpis[0] ? d.kpis[0][1] : d.distTot;
  const totalMatch = String(d.sub || '').match(/(\d+)\s+checks/i);
  const total = totalMatch ? totalMatch[1] : evaluated;
  const pass = d.kpis && d.kpis[3] ? d.kpis[3][1] : '';
  const right = `<div style="font-size:64px;font-weight:700;color:${SPINE[word].text};line-height:1;">${word}</div>`;
  const dist = (d.dist || []).map(([label,n,c],i)=>{
    const pct = (Number(n) || 0) / Math.max(Number(d.distTot) || 1, 1) * 100;
    const radius = i===0 ? '999px 0 0 999px' : i===(d.dist || []).length-1 ? '0 999px 999px 0' : '0';
    return `<div style="border-radius:${radius};width:${pct}%;background:${standardStatusColor(c)};display:flex;align-items:center;padding-left:16px;color:#ffffff;font-weight:700;font-size:38px;">${fmtCount(n)}</div>`;
  }).join('');
  const legend = (d.dist || []).map(([label,n,c])=>`<div style="display:flex;align-items:center;gap:10px;"><span style="width:14px;height:14px;border-radius:7px;background:${standardStatusColor(c)};"></span>${srcText(label)} ${SRC_DOT} <span style="font-weight:700;">${fmtCount(n)}</span></div>`).join('');
  const rows = (d.sections || []).map(([name,p,w,f])=>{
    const total = Math.max((Number(p)||0)+(Number(w)||0)+(Number(f)||0), 1);
    const parts = [[p,SRC_HEALTHY],[w,SRC_ATTENTION],[f,SRC_CRITICAL]].filter(([n])=>Number(n)>0);
    const bar = parts.map(([n,c],i)=>`<div style="border-radius:${parts.length===1?'999px':i===0?'999px 0 0 999px':i===parts.length-1?'0 999px 999px 0':'0'};width:${Number(n)/total*100}%;background:${c};"></div>`).join('');
    return `<div style="display:flex;align-items:center;gap:24px;">
      <div data-single-line="object-label" style="width:440px;font-size:38px;flex:0 0 auto;">${srcText(name)}</div>
      <div style="flex:1;height:40px;border-radius:999px;overflow:hidden;background:${SRC_TRACK};display:flex;">${bar}</div>
      <div style="width:500px;font-size:38px;text-align:right;flex:0 0 auto;">${srcSectionCounts(p, w, f)}</div>
    </div>`;
  }).join('');
  return srcHeader(d.title, `Console dashboard rollup &middot; ${fmtCount(evaluated)} of ${fmtCount(total)} checks evaluated &middot; ${srcText(pass)} passed &middot; ${srcDate(d.sub)}`, right)
    + srcRule(28)
    + srcEyebrow(`Status distribution &middot; ${fmtCount(d.distTot)} checks`, 30)
    + `<div style="display:flex;height:40px;margin-top:16px;border-radius:999px;overflow:hidden;">${dist}</div>`
    + `<div style="display:flex;align-items:center;gap:34px;margin-top:16px;font-size:38px;">${legend}</div>`
    + srcEyebrow('Section Health &middot; Failed and Needs Attention First', 36)
    + `<div style="display:flex;flex-direction:column;gap:14px;margin-top:16px;">${rows}</div>`
    + srcFooter('Findings raised', srcDashboardFindingLine(d));
}

function buildRisks(d){
  const total = Number.isFinite(countNumber(d.count)) ? countNumber(d.count) : (d.risks || []).length;
  const rows = (d.risks || []).map(srcRiskRow).join('');
  const shown = (d.risks || []).length;
  const hiddenRaw = countNumber(d.hiddenCount);
  const hidden = Number.isFinite(hiddenRaw) ? Math.max(hiddenRaw, 0) : Math.max(total - shown, 0);
  const medium = Math.max(countNumber(d.mediumCount) || 0, 0);
  const low = Math.max(countNumber(d.lowCount) || 0, 0);
  const more = hidden > 0
    ? `<div style="font-size:38px;margin-top:18px;">${fmtCount(medium)} Medium and ${fmtCount(low)} Low in Findings and Recommendations.</div>`
    : '';
  return `<div>
      <div style="font-size:64px;font-weight:700;">${srcText(d.title || 'What Needs Attention')}</div>
      <div style="font-size:38px;margin-top:8px;">Prioritized remediation items ${SRC_DOT} ${hidden > 0 ? `${fmtCount(shown)} of ${fmtCount(total)} shown` : `${fmtCount(total)} items`} ${SRC_DOT} Source ID traces each to its check</div>
    </div>`
    + srcRule(28)
    + `<div style="display:flex;flex-direction:column;gap:16px;margin-top:28px;">${rows}</div>${more}`;

async function render(){
  injectSpineCss();
  const d = window.DATA || {};
  const build = BUILDERS[d.chart];
  const mount = document.getElementById('mount');
  // Overview uses the tighter dashboard card; Snapshot has no outer wrapper;
  // the rest supply their own frame in the markup.
  if(d.chart==='overview') mount.className = 'dashcard';
  else if(d.chart==='snapshot') mount.className = 'snapshot';
  else mount.className = (d.chart==='loop' || d.chart==='filldb') ? '' : 'card';
  mount.classList.add(`chart-${String(d.chart || 'unknown').replace(/[^a-z0-9_-]/ig,'').toLowerCase()}`);
  mount.innerHTML = build ? build(d) : `<div style="padding:40px;color:${SPINE['Critical'].text};">Unknown chart: ${d.chart}</div>`;
  markSingleLineCells();
  try { await document.fonts.ready; } catch(e){}
  scaleTypeRamp();
  fitNumericValues();
  window.__RENDERED__ = true;
}
