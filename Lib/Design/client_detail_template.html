<!doctype html><html><head><meta charset="utf-8"><!--__FONTFACE__-->
<style>
*{box-sizing:border-box}body{margin:0;background:white;color:#000032;font-family:Aptos,sans-serif}#mount{width:2250px;padding:0 4px 4px 0;font-size:38px;line-height:1.35}strong{font-weight:700}.row{display:grid;grid-template-columns:560px minmax(0,1fr) 250px;gap:28px;align-items:center;min-height:64px}.track{height:var(--progress-bar-height);background:#F0F2F5;display:flex;overflow:hidden;border-radius:var(--progress-bar-radius)}.segment{height:100%;flex-shrink:0}.segment:only-child{border-radius:var(--progress-bar-radius)}.value{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.legend{display:flex;gap:35px;flex-wrap:wrap;margin-top:14px}.dot{width:28px;height:28px;display:inline-block;border-radius:50%;border:2px solid currentColor;margin-right:10px;vertical-align:middle}.note{margin-top:20px}.cost{display:grid;grid-template-columns:60px minmax(0,1.7fr) minmax(0,1fr) 180px 250px;gap:25px;align-items:center;margin:16px 0;min-height:65px}.muted{color:#000032}.property{font-size:32px;border:1px solid #000032;border-radius:2px;padding:0 7px;white-space:nowrap}.frequency{display:grid;grid-template-columns:490px minmax(0,1fr) 330px 350px;gap:28px;align-items:center;margin:16px 0;min-height:64px}.status{white-space:nowrap;font-size:35px}.rule{height:2px;background:#CAD5E2;margin:25px 0}.tile{border:2px solid #CAD5E2;border-radius:10px;padding:24px;min-width:0}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px}.number{font-size:64px;font-weight:700;line-height:1.2;margin-top:8px}.small{font-size:34px}
</style></head><body><div id="mount"></div><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=v=>Number(v||0).toLocaleString('en-US');
const percent=(n,t)=>{const p=t?n/t*100:0;return p>0&&p<.05?'&lt;0.1%':p.toFixed(1)+'%'};
const teal='#0C7E88',navy='#000032',missing='#AEB8C6',track='#F0F2F5';
const dot=(color,label)=>`<span><span class="dot" style="color:${color};background:${color}"></span>${label}</span>`;
function parts(rows,total){return `<div class="track">${rows.map(r=>`<span class="segment" style="width:${total?r.count/total*100:0}%;background:${r.color||teal};${r.missing?'border:2px solid #788598;':''}"></span>`).join('')}</div>`;}
function distribution(d){return parts(d.rows,d.total)+`<div class="legend">${d.rows.map(r=>dot(r.color||teal,`${esc(r.label)}: ${number(r.count)} / ${number(d.total)} (${percent(r.count,d.total)})`)).join('')}</div>`;}
function duty(d){return d.rows.map(r=>`<div style="margin:10px 0 24px"><div style="display:flex;justify-content:space-between;margin-bottom:14px"><span>${number(r.count)} / ${number(d.total)} devices with these settings</span><strong>${esc(r.duty)} configured duty cycle</strong></div>${parts([{count:r.work,color:teal},{count:r.sleep,color:missing}],r.work+r.sleep)}<div class="legend">${dot(teal,esc(r.work)+' ms work')}${dot(missing,esc(r.sleep)+' ms sleep')}</div></div>`).join('')+(d.unset?`<div class="note">Work, sleep and duty cycle Not Set: ${number(d.unset)} / ${number(d.total)} devices.</div>`:'');}
function costs(d){const max=Math.max(...d.rows.map(r=>r.seconds),1);return `<div class="cost"><span></span><span>Evaluation</span><span></span><span class="value">Avg time</span><span class="value">Occurrences</span></div>`+d.rows.map(r=>`<div class="cost" data-split-row><strong>${r.rank}</strong><div>${esc(r.name)} ${r.property?'<span class="property">property</span>':''}${r.property?`<div class="small">Interval: ${esc(r.interval)}</div>`:''}</div><div class="track"><span class="segment" style="width:${r.seconds/max*100}%;background:${navy}"></span></div><strong class="value">${r.seconds.toFixed(1)} s</strong><div class="value">${number(r.occurrences)}</div></div>`).join('');}
function frequency(d){
 const row=r=>{const status=window.SPINE[r.status]||window.SPINE['Not Assessed'];return `<div class="frequency" data-split-row><span style="padding-left:18px">${esc(r.label)}</span>${parts([{count:r.external,color:navy},{count:r.custom,color:teal}],d.total)}<strong class="value">${number(r.count)} &middot; ${percent(r.count,d.total)}</strong><strong class="status" style="color:${status.text};background:${status.bg};border-radius:8px;padding:6px 12px">${dot(status.mark,esc(r.status))}</strong></div>`;};
 return `<div class="legend">${dot(navy,'External')}${dot(teal,'Custom')}</div><div style="position:relative"><span style="position:absolute;left:0;top:16px;bottom:0;width:3px;background:#B45309"></span>${d.rows.slice(0,2).map(row).join('')}<div class="note" style="padding-left:18px"><strong>Counted in CLT-01: ${number(d.frequent)}</strong></div></div>${d.rows.slice(2).map(row).join('')}`;
}
function groups(d){return d.rows.map(r=>`<div class="row" data-split-row><span>${esc(r.label)}</span>${parts([{count:r.count,color:r.color}],d.total)}<strong class="value">${number(r.count)} &middot; ${percent(r.count,d.total)}</strong></div>`).join('');}
function counts(d){return d.rows.map(r=>`<div style="margin:20px 0"><div style="display:flex;justify-content:space-between;margin-bottom:14px"><strong>${esc(r.label)}</strong><span>${number(r.count)} / ${number(r.total)}</span></div>${parts([{count:r.count,color:teal}],r.total)}</div>`).join('');}
function checks(d){return `<div class="tiles">${d.checks.map(r=>`<div class="tile"><span>${esc(r.label)}</span><div class="number">${number(r.count)}</div><div>${percent(r.count,d.total)} of ${number(d.total)} devices</div></div>`).join('')}</div><div class="note">Each device is counted in no more than one of these three checks.</div>`;}
/*__DATA__*/
const d=window.DATA||{};const builders={distribution,duty,costs,frequency,groups,counts,checks};document.getElementById('mount').innerHTML=(builders[d.kind]||distribution)(d);document.fonts.ready.then(()=>window.__RENDERED__=true);
</script></body></html>
