[project]
name = "master-class-diagnostics-workbench"
version = "2.1"
description = "Master Class Diagnostics Workbench: automated performance and configuration analysis for BigFix."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "python-docx>=1.1.0",
    "defusedxml>=0.7.1",
    "Pillow>=9.0.0",
    "matplotlib>=3.7.0",
    "numpy>=1.26",
    # playwright drives a headless SYSTEM browser (Edge or Chrome) to render
    # the Infographic outputs from Assets/chart_template.html. It uses the
    # installed browser via channel="msedge"/"chrome", so no Chromium download
    # is needed. Edge ships with Windows.
    "playwright>=1.40.0",
    "openpyxl>=3.1.0",
    "xlrd==2.0.2",
    "pandas>=2.0.0",
    "xlsxwriter>=3.0.0",
    # customtkinter powers the desktop UI.
    "customtkinter>=5.2.0,<6.0.0",
]

[dependency-groups]
validation = ["pypdfium2>=4.30,<6", "pyinstaller>=6.16,<7"]
dev = [
    "bandit>=1.9.4",
    "cyclonedx-bom>=7.3.0",
    "mypy>=2.1.0",
    "pip-audit>=2.10.0",
    "pip-licenses>=5.5.5",
    "pytest>=8.0.0",
    "ruff>=0.15.14",
    "vulture>=2.16",
]

[tool.uv]
# Dependency cooldown: never lock a package version published after this
# cutoff. Build/refresh-lockfile.ps1 moves it to seven days before the day
# it runs. The project Security policy documents the dependency cooldown.
exclude-newer = "2026-10-19T00:00:00Z"  # auto-managed by refresh-lockfile.ps1
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }

[tool.pytest.ini_options]
testpaths = ["Tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"
markers = [
    "integration: tests that execute full module pipelines or require realistic evidence files",
    "slow: tests that can take several seconds or more",
]

[tool.ruff]
line-length = 90
target-version = "py312"
extend-exclude = ["SampleData", "Fonts", "Templates"]

[tool.ruff.lint]
# E402: the scripts extend sys.path before importing shared modules.
select = ["E", "F", "W", "I", "UP"]
ignore = ["E402", "E501"]

[tool.bandit]
exclude_dirs = [".venv", "Temp", "Dist", "Tests", "SampleData"]
